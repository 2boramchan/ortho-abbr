<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>병동 약어</title>
  <meta name="description" content="간호대 학생을 위한 병동 의학 약어(정형외과·외과 GS) 단어장과 주관식 퀴즈">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 첫 렌더 전에 저장된 테마 적용(깜빡임 방지)
    try {
      var t = (JSON.parse(localStorage.getItem('ortho-abbr:v1')) || {}).settings?.theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <h1 class="sr-only">병동 약어</h1>
      <div class="subjects" id="subjects" role="group" aria-label="과목">
        <button type="button" data-subject="ortho" aria-pressed="true">정형외과</button>
        <button type="button" data-subject="gs" aria-pressed="false">외과(GS)</button>
      </div>
      <button id="theme" class="ghost small" type="button" aria-label="테마 전환">테마: 자동</button>
    </div>
    <div class="wrap">
      <nav class="tabs" role="tablist" aria-label="학습 모드">
        <button role="tab" id="tab-cards" aria-controls="view-cards" aria-selected="true" type="button">단어장</button>
        <button role="tab" id="tab-quiz" aria-controls="view-quiz" aria-selected="false" type="button">주관식 퀴즈</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <details class="filters" id="filters">
      <summary>
        <span>필터</span>
        <span class="muted" id="filter-summary"></span>
      </summary>
      <div class="filter-body">
        <fieldset>
          <legend>상태</legend>
          <div class="chips" id="f-status"></div>
        </fieldset>
        <fieldset>
          <legend>알파벳 구간</legend>
          <div class="chips" id="f-range"></div>
        </fieldset>
        <fieldset>
          <legend>분류 <span class="muted">(여러 개 선택 가능)</span></legend>
          <div class="chips" id="f-tags"></div>
        </fieldset>
        <div class="filter-foot">
          <span class="muted" id="stats"></span>
          <button type="button" class="ghost small danger" id="reset">진행 상황 초기화</button>
        </div>
      </div>
    </details>

    <p class="notice" id="storage-warning" hidden>이 브라우저에서는 진행 상황을 저장할 수 없어요. 앱은 그대로 쓸 수 있지만 새로고침하면 기록이 사라져요.</p>

    <!-- 단어장 -->
    <section id="view-cards" role="tabpanel" aria-labelledby="tab-cards">
      <div class="bar">
        <span id="card-pos" class="muted">0 / 0</span>
        <label class="switch"><input type="checkbox" id="shuffle"> 셔플(헷갈리는 카드 먼저)</label>
      </div>

      <button type="button" class="card" id="card" aria-describedby="card-help">
        <div class="face front">
          <span class="tag-pill" id="card-tag"></span>
          <span class="abbr" id="card-abbr"></span>
          <span class="muted hint">눌러서 뒤집기</span>
        </div>
        <div class="face back" aria-live="polite">
          <span class="abbr-sm" id="card-abbr2"></span>
          <span class="full" id="card-full"></span>
          <span class="note" id="card-note"></span>
          <span class="ko" id="card-ko"></span>
          <span class="others" id="card-others"></span>
        </div>
      </button>
      <p id="card-empty" class="empty" hidden>조건에 맞는 카드가 없어요. 필터를 바꿔 보세요.</p>

      <div class="card-actions">
        <button type="button" id="prev" class="ghost" aria-label="이전 카드">←</button>
        <button type="button" id="unsure" class="warn">헷갈려요</button>
        <button type="button" id="known" class="ok">외웠어요</button>
        <button type="button" id="next" class="ghost" aria-label="다음 카드">→</button>
      </div>
      <p class="muted small-text" id="card-help">
        <kbd>Space</kbd> 뒤집기 · <kbd>←</kbd><kbd>→</kbd> 이동 · <kbd>1</kbd> 외웠어요 · <kbd>2</kbd> 헷갈려요
        <span id="card-box"></span>
      </p>
    </section>

    <!-- 퀴즈 -->
    <section id="view-quiz" role="tabpanel" aria-labelledby="tab-quiz" hidden>
      <div id="quiz-setup" class="panel">
        <h2>주관식 퀴즈</h2>
        <p>약어를 보고 <b>영어 풀네임</b>을 입력하세요. 대소문자·띄어쓰기·하이픈·마침표는 신경 쓰지 않아도 돼요.</p>
        <p class="muted" id="quiz-pool"></p>
        <fieldset>
          <legend>문제 수</legend>
          <div class="chips" id="quiz-len"></div>
        </fieldset>
        <button type="button" class="primary" id="quiz-start">시작하기</button>
      </div>

      <div id="quiz-play" hidden>
        <div class="bar">
          <span id="quiz-pos" class="muted"></span>
          <span id="quiz-score"></span>
        </div>
        <div class="progress" role="progressbar" aria-label="진행률" aria-valuemin="0" id="quiz-progress">
          <div class="progress-fill" id="quiz-progress-fill"></div>
        </div>
        <div class="panel q">
          <div class="abbr" id="quiz-abbr"></div>
          <form id="quiz-form" autocomplete="off">
            <label for="quiz-input" class="sr-only">영어 풀네임</label>
            <input id="quiz-input" type="text" placeholder="영어 풀네임 입력 후 Enter"
                   autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
            <div class="q-actions" id="q-ask-actions">
              <button type="button" class="ghost" id="quiz-skip">모르겠어요 <kbd>Esc</kbd></button>
              <button type="submit" class="primary">제출 <kbd>Enter</kbd></button>
            </div>
          </form>
          <p class="hint-line" id="quiz-hint" role="status"></p>
          <div id="quiz-feedback" hidden>
            <p class="verdict" id="quiz-verdict" role="status"></p>
            <ul class="answers" id="quiz-answers"></ul>
            <div class="q-actions">
              <button type="button" class="ghost" id="quiz-override" hidden>철자만 틀렸어요, 정답 처리</button>
              <button type="button" class="primary" id="quiz-next">다음 <kbd>Enter</kbd></button>
            </div>
          </div>
        </div>
      </div>

      <div id="quiz-result" class="panel" hidden>
        <h2>결과</h2>
        <p class="big-score" id="result-score"></p>
        <h3 id="result-wrong-title">틀린 문제</h3>
        <ul class="wrong-list" id="result-wrong"></ul>
        <div class="q-actions">
          <button type="button" class="ghost" id="result-new">새 퀴즈</button>
          <button type="button" class="primary" id="result-retry">틀린 문제만 다시</button>
        </div>
      </div>
    </section>

    <p class="empty" id="load-error" hidden></p>
  </main>

  <footer class="wrap muted small-text">
    <span id="source"></span>
  </footer>
</body>
</html>
